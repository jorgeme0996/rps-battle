<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="RPS Battle" />
  <meta name="theme-color" content="#0c0a1f" />
  <meta name="description" content="Craftea piedra, papel o tijera y lánzaselos a tu rival en tiempo real. ¡Duelo 1 vs 1 de 3 minutos!" />
  <meta property="og:title" content="RPS Battle ⚔️" />
  <meta property="og:description" content="Craftea piedra, papel o tijera y lánzaselos a tu rival. ¿Te atreves?" />
  <meta property="og:type" content="website" />
  <title>RPS Battle</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon-512.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #0c0a1f;
      overflow: hidden;
      overscroll-behavior: none;
      font-family: 'Nunito', sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }
    #game { width: 100%; height: 100%; }
    canvas {
      display: block;
      touch-action: none;
    }
    #nameInput {
      display: none;
      position: fixed;
      z-index: 5;
      transform-origin: center;
      width: 250px;
      padding: 14px 16px;
      font: 800 20px 'Nunito', sans-serif;
      color: #fff7ea;
      background: #1f1a42;
      border: 3px solid #3a3370;
      border-radius: 16px;
      box-shadow: 0 5px 0 #0c0a1f;
      outline: none;
      text-align: center;
      transition: border-color .15s;
      touch-action: auto;
      pointer-events: auto;
      -webkit-user-select: text;
      user-select: text;
    }
    #nameInput:focus { border-color: #ffc93c; }
    #nameInput::placeholder { color: #6b64a3; }
    #nameInput:disabled { opacity: .5; }

    #loader {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      background: radial-gradient(circle at 50% 25%, #2d2468, #14112b 50%, #0c0a1f);
      color: #ffc93c;
      font: 64px 'Lilita One', 'Arial Black', sans-serif;
      -webkit-text-stroke: 3px #1a1433;
      transition: opacity .35s;
    }
    #loader.hide { opacity: 0; pointer-events: none; }
    #loader .spin {
      width: 42px; height: 42px; border-radius: 50%;
      border: 5px solid #3a3370; border-top-color: #2ee6c5;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loader">RPS<div class="spin"></div></div>
  <div id="game"></div>
  <input id="nameInput" type="text" maxlength="16" placeholder="Jugador"
    autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="go" />
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
